[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-parser"
version = "0.1.0"
description = "Read-only reader for Hive boxes, the key-value store Flutter apps write, as vendored by the LEAPP tools"
# No dependencies. That is what lets the LEAPP cores vendor it as one file.
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Alexis Brignoni" }]

[project.urls]
Homepage = "https://github.com/abrignoni/hive-parser"

[project.scripts]
hive-parser = "hive_parser.__main__:main"

[tool.setuptools]
packages = ["hive_parser"]
